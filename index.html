<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piper Champion</title>
  <meta name="description" content="Piper Champion: learn the Great Highland bagpipe chanter. Coming soon.">
  <meta name="theme-color" content="#0B111C">
  <meta property="og:title" content="Piper Champion">
  <meta property="og:description" content="Learn the Great Highland bagpipe chanter. Coming soon.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* The app's colours: the same night-blue background and light letters as its launch screen. */
    :root {
      --background: #0B111C;
      --text: #E8ECF3;
      --muted: #9AA6B8;
      --dim: #7D8BA3;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--background);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 16px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(14px, 2.5vw, 22px);
    }
    h1 {
      font-weight: 700;
      font-size: clamp(2.6rem, 11vw, 6.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .soon {
      color: var(--muted);
      font-weight: 500;
      font-size: clamp(1.15rem, 3.6vw, 1.75rem);
      letter-spacing: 0.01em;
    }
    footer {
      color: var(--dim);
      font-size: 0.8rem;
      text-align: center;
      padding: 24px 0 calc(24px + env(safe-area-inset-bottom));
    }
    /* A gentle fade-in, unless the reader prefers no motion. */
    @media (prefers-reduced-motion: no-preference) {
      h1, .soon { animation: rise 900ms ease-out both; }
      .soon { animation-delay: 250ms; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main>
    <h1>Piper Champion</h1>
    <p class="soon">Coming soon</p>
  </main>
  <footer>&copy; <span id="year">2026</span> Piper Champion</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
